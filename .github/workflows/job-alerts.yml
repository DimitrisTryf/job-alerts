name: Telegram job alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: telegram-job-alerts
  cancel-in-progress: false

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and publish new jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@dtjobalerts"
        run: python telegram-bot/job_alerts.py
      - name: Save seen job IDs
        if: always()
        run: |
          if git diff --quiet -- telegram-bot/seen-jobs.json; then
            exit 0
          fi
          git config user.name "dt-job-alerts[bot]"
          git config user.email "dt-job-alerts[bot]@users.noreply.github.com"
          git add telegram-bot/seen-jobs.json
          git commit -m "Update seen job IDs"
          git push
